<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BabyFlow 2 (Beta)</title>
<meta name="theme-color" content="#f8f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BabyFlow 2">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f8f5f1;--card:#fff;--ink:#292724;--muted:#77716b;--line:#e8e1da;--accent:#7b6f63;--soft:#eee8e2;--warn:#fff5dc;--danger:#8d3f3f;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:20px 16px 92px}h1{font-size:26px;margin:0}h2{font-size:20px;margin:8px 0 16px}h3{font-size:16px;margin:0 0 10px}.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.badge{font-size:12px;background:var(--soft);padding:5px 9px;border-radius:99px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:11px 14px;background:var(--ink);color:#fff;cursor:pointer}button.secondary{background:var(--soft);color:var(--ink)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.danger{background:#f7e6e6;color:var(--danger)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}label{display:grid;gap:6px;font-size:13px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav-inner{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.nav button{background:transparent;color:var(--muted);padding:9px}.nav button.active{color:var(--ink);font-weight:700}.event{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.time{font-weight:650}.event-title{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}.state{font-size:11px;padding:4px 7px;border-radius:99px;background:var(--soft);white-space:nowrap}.state.actual{background:#e6f1e7}.state.locked{background:#eee8f7}.ww{padding:7px 0 7px 88px;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line)}.event{cursor:pointer}.conflict-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.conflict-actions button{padding:7px 9px;font-size:12px}.notice{background:var(--warn);border:1px solid #eddba8;border-radius:14px;padding:12px;margin:12px 0}.fab{width:100%;margin-top:12px}.hidden{display:none!important}.setup{max-width:520px;margin:8vh auto}.progress{height:5px;background:var(--soft);border-radius:99px;overflow:hidden;margin:16px 0}.progress span{display:block;height:100%;background:var(--accent)}.section-title{margin-top:22px}.history-day{cursor:pointer}.small{font-size:12px}.pill{display:inline-block;padding:4px 8px;background:var(--soft);border-radius:99px;font-size:12px}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{background:var(--bg);width:min(760px,100%);max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}.sheet h2{margin-top:0}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;max-width:620px}} 
</style>
</head>
<body><main id="app" class="app"></main><div id="nav"></div><div id="modal"></div>
<script>
(()=>{
'use strict';
const APP='babyflow2', SCHEMA=3, KEY='babyflow2:v3:data';
const uid=()=>crypto.randomUUID?.()||('bf2-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const defaults=()=>({schema:SCHEMA,profile:{babyName:''},setupComplete:false,settings:{goodMorning:'',bedtime:'20:00',feedDuration:'20',feedInterval:'150',wakeWindow:'60',napDuration:'60',extraFeedDuration:'10',dreamFeedDuration:'20',dreamFeedTimes:'',minCatNap:20,extraFeedResetsInterval:false,exceptions:{feeds:{},naps:{},wakeWindows:{}}},advanced:{goodMorningRangePoint:'beginning',feedRangePoint:'beginning',wakeRangePoint:'middle',napRangePoint:'middle',bedtimeRangePoint:'beginning',extraFeedRangePoint:'middle',showElapsed:false,showRemaining:false,adjustmentDistribution:'later',activityAutoComplete:false,activityDurationDisplay:true},activities:{builtins:['Bath','Dry off / Lotion / PJs','Tummy Time','Walk','Play'],custom:[],hidden:[]},currentDay:null,history:[],meta:{createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(!x||x.schema!==SCHEMA)return defaults();return x}catch{return defaults()}}
let db=load(), view='today';
function save(){db.meta.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db))}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mins(t){if(!t)return null;let [h,m]=t.split(':').map(Number);return h*60+m} function time(m){m=(m+1440)%1440;let h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`}
function isoDay(){return new Date().toISOString().slice(0,10)}
function event(type,title,start,duration,state='projected',extra={}){return {id:uid(),type,title,start,duration,state,locked:false,locks:{start:false,duration:false},actualStart:null,actualEnd:null,projectedStart:start,projectedDuration:duration,notes:'',...extra}}
function rangeSpec(v,point='middle'){let a=String(v??'').trim(),m=a.match(/^(\d+(?:\.\d+)?)\s*(?:-|–|to)\s*(\d+(?:\.\d+)?)$/i),lo,hi;if(m){lo=+m[1];hi=+m[2]}else{lo=hi=+a||0}if(hi<lo)[lo,hi]=[hi,lo];let preferred=Math.round(point==='beginning'?lo:point==='end'?hi:(lo+hi)/2);return {min:lo,max:hi,preferred}}
function effective(key){let map={feedDuration:'feedRangePoint',feedInterval:'feedRangePoint',wakeWindow:'wakeRangePoint',napDuration:'napRangePoint',extraFeedDuration:'extraFeedRangePoint'};return rangeSpec(db.settings[key],db.advanced[map[key]]||'middle').preferred}
function spec(key){let map={feedDuration:'feedRangePoint',feedInterval:'feedRangePoint',wakeWindow:'wakeRangePoint',napDuration:'napRangePoint',extraFeedDuration:'extraFeedRangePoint'};return rangeSpec(db.settings[key],db.advanced[map[key]]||'middle')}
function exceptionSpec(kind,pos,key){let ex=db.settings.exceptions?.[kind]?.[pos];if(!ex||ex[key]==null||String(ex[key]).trim()==='')return null;let point=key==='wakeWindow'?'wakeRangePoint':key==='napDuration'?'napRangePoint':'feedRangePoint';return rangeSpec(ex[key],db.advanced[point]||'middle')}
function eventRule(d,e,key,pos){let ov=(d.overrides||[]).find(o=>o.eventId===e.id&&o[key]!=null);if(ov)return rangeSpec(ov[key],'middle');let kind=e.type==='nap'?(key==='wakeWindow'?'wakeWindows':'naps'):'feeds';return exceptionSpec(kind,pos,key)||spec(key)}
function chooseWithin(r,target){return Math.max(r.min,Math.min(r.max,Math.round(target)))}
function movable(e,part='start'){return e.state!=='actual'&&!e.locked&&!e.locks?.[part]}
function overlaps(a,b){let ae=a.start+(a.duration||0),be=b.start+(b.duration||0);return (a.duration||0)>0&&(b.duration||0)>0&&a.start<be&&ae>b.start}
function normalizeDay(d){d.events.sort((a,b)=>(a.actualStart??a.start)-(b.actualStart??b.start));let feeds=d.events.filter(e=>e.type==='feed'&&e.title.startsWith('Feed '));feeds.forEach((e,i)=>e.title=`Feed ${i+1}`);let naps=d.events.filter(e=>e.type==='nap');naps.forEach((e,i)=>e.title=`Nap ${i+1}`)}
function resolverConflict(d,code,message,choices=[]){if(!d.conflicts.some(c=>(typeof c==='string'?c:c.code)===code))d.conflicts.push({code,message,choices})}
function clearResolverConflicts(d){d.conflicts=(d.conflicts||[]).filter(c=>typeof c==='string')}
function buildProjection(gm){const s=db.settings,start=mins(gm),bed0=mins(s.bedtime);if(start==null||bed0==null)return null;let bed=bed0;if(bed<=start)bed+=1440;let fd=effective('feedDuration'),fi=effective('feedInterval'),ww=effective('wakeWindow'),nd=effective('napDuration'),cat=+s.minCatNap||0;let ev=[event('goodMorning','Good Morning ☀️',start,0,'actual',{actualStart:start})];
 // feeds are independently generated start-to-start from Good Morning
 for(let t=start,n=1;t<bed;t+=fi,n++)ev.push(event('feed',`Feed ${n}`,t,fd));
 // naps are generated from WW boundaries. Final nap may be shortened to preserve final WW.
 let cursor=start,n=1;while(true){let ns=cursor+ww;if(ns>=bed)break;let available=bed-ns-ww;if(available<=0)break;let dur=Math.min(nd,available);if(dur<cat)break;ev.push(event('nap',`Nap ${n++}`,ns,dur));cursor=ns+dur}
 ev.push(event('goodnight','Goodnight 💤🌙',bed,0));ev.sort((a,b)=>a.start-b.start);return ev}
function reconcileDay(d){if(!d)return;clearResolverConflicts(d);d.overrides=d.overrides||[];let gm=d.events.find(e=>e.type==='goodMorning'),gn=d.events.find(e=>e.type==='goodnight');if(!gm||!gn){resolverConflict(d,'missing-anchor','BabyFlow could not find both day anchors. Known timeline state was preserved.');return}
 let start=gm.actualStart??gm.start,bed=gn.actualStart??gn.start;if(bed<=start)bed+=1440;
 let fixed=d.events.filter(e=>e.state==='actual'||e.locked);for(let i=0;i<fixed.length;i++)for(let j=i+1;j<fixed.length;j++)if(overlaps(fixed[i],fixed[j]))resolverConflict(d,'fixed-overlap-'+fixed[i].id+'-'+fixed[j].id,`${fixed[i].title} and ${fixed[j].title} overlap, but BabyFlow will not move an Actual or Locked event.`);
 let feeds=d.events.filter(e=>e.type==='feed'||e.type==='dreamFeed').sort((a,b)=>(a.actualStart??a.start)-(b.actualStart??b.start));for(let i=0;i<feeds.length;i++){let e=feeds[i],durR=eventRule(d,e,'feedDuration',i+1);if(movable(e,'duration'))e.duration=chooseWithin(durR,e.duration??durR.preferred);if(i){let prev=feeds[i-1],r=eventRule(d,e,'feedInterval',i+1),anchor=prev.actualStart??prev.start,desired=anchor+r.preferred;if(movable(e,'start'))e.start=chooseWithin({min:anchor+r.min,max:anchor+r.max},desired);else{let gap=(e.actualStart??e.start)-anchor,isActual=e.state==='actual'||e.actualStart!=null;if(!isActual&&(gap<r.min||gap>r.max))resolverConflict(d,'feed-range-'+e.id,`${e.title} is ${gap} minutes after the prior feed, outside its allowed ${r.min}-${r.max} minute interval. BabyFlow preserved the Lock.`)}}}
 let dreams=d.events.filter(e=>e.type==='dreamFeed').sort((a,b)=>(a.actualStart??a.start)-(b.actualStart??b.start));for(let dr of dreams){let ds=dr.actualStart??dr.start,next=feeds.find(f=>(f.actualStart??f.start)>ds);if(next&&movable(next,'start')){let pos=feeds.indexOf(next)+1,r=eventRule(d,next,'feedInterval',pos);next.start=ds+r.preferred}}
 let extras=d.events.filter(e=>e.type==='extraFeed'&&e.resetsInterval);for(let ex of extras){let xs=ex.actualStart??ex.start,next=feeds.find(f=>(f.actualStart??f.start)>xs);if(next&&movable(next,'start')){let pos=feeds.indexOf(next)+1,r=eventRule(d,next,'feedInterval',pos);next.start=xs+r.preferred}}
 let naps=d.events.filter(e=>e.type==='nap').sort((a,b)=>(a.actualStart??a.start)-(b.actualStart??b.start)),prevEnd=start;for(let i=0;i<naps.length;i++){let nap=naps[i],pos=i+1,wr=eventRule(d,nap,'wakeWindow',pos),nr=eventRule(d,nap,'napDuration',pos),desired=prevEnd+wr.preferred;if(movable(nap,'start'))nap.start=chooseWithin({min:prevEnd+wr.min,max:prevEnd+wr.max},desired);else{let gap=(nap.actualStart??nap.start)-prevEnd,isActual=nap.state==='actual'||nap.actualStart!=null;if(!isActual&&(gap<wr.min||gap>wr.max))resolverConflict(d,'ww-range-'+nap.id,`${nap.title} starts after a ${gap} minute wake window, outside its allowed ${wr.min}-${wr.max} minute range. BabyFlow preserved the Lock.`)}if(movable(nap,'duration'))nap.duration=chooseWithin(nr,nap.duration??nr.preferred);let ns=nap.actualStart??nap.start,ne=nap.actualEnd??(ns+(nap.duration||0));prevEnd=ne}
 if(naps.length){let last=naps[naps.length-1],pos=naps.length,wr=eventRule(d,last,'wakeWindow',pos+1),ls=last.actualStart??last.start,maxDur=bed-wr.preferred-ls;if(movable(last,'duration')&&maxDur<(last.duration||0)){let nr=eventRule(d,last,'napDuration',pos),fit=Math.min(nr.max,maxDur);if(fit>=Math.max(nr.min,+db.settings.minCatNap||0))last.duration=fit;else if(maxDur>=(+db.settings.minCatNap||0))last.duration=maxDur;else resolverConflict(d,'bedtime-fit','The final nap cannot fit with the minimum cat nap, final wake window, and bedtime target.',['skip','shorten','push'])}}
 let lastNap=naps[naps.length-1];if(lastNap){let le=lastNap.actualEnd??((lastNap.actualStart??lastNap.start)+(lastNap.duration||0)),r=eventRule(d,lastNap,'wakeWindow',naps.length+1),gap=bed-le;if((gap<r.min||gap>r.max)&&(lastNap.state==='actual'||lastNap.locked||gn.state==='actual'||gn.locked))resolverConflict(d,'fixed-final-ww',`The final wake window is ${gap} minutes, outside its allowed ${r.min}-${r.max} minute range. BabyFlow did not change an Actual or Lock.`)}
 normalizeDay(d)}
function generateDay(gm){let ev=buildProjection(gm);if(!ev)return null;let d={id:uid(),date:isoDay(),startedAt:new Date().toISOString(),goodMorningActual:gm,events:ev,conflicts:[],overrides:[]};reconcileDay(d);return d}
function setup(){let step=0;const fields=[['Baby name (optional)','babyName','text',db.profile.babyName],['Good Morning target (optional)','goodMorning','time',db.settings.goodMorning],['Bedtime target','bedtime','time',db.settings.bedtime],['Default feed interval (minutes)','feedInterval','number',db.settings.feedInterval],['Default feed duration (minutes)','feedDuration','number',db.settings.feedDuration],['Default wake window (minutes)','wakeWindow','number',db.settings.wakeWindow],['Default nap duration (minutes)','napDuration','number',db.settings.napDuration]];
 function draw(){let f=fields[step];app.innerHTML=`<div class="setup"><span class="badge">BabyFlow 2 (Beta · BF2 v1.0.1)</span><h1 style="margin-top:12px">Set up BabyFlow</h1><p class="muted">Just the essentials. You can change these later.</p><div class="progress"><span style="width:${((step+1)/fields.length)*100}%"></span></div><div class="card"><label>${f[0]}<input id="setupInput" type="${f[2]}" value="${esc(f[3])}"></label></div><div class="row between">${step?'<button class="secondary" id="back">Back</button>':'<span></span>'}<button id="next">${step===fields.length-1?'Finish':'Next'}</button></div></div>`; nav.innerHTML='';
 document.querySelector('#back')?.addEventListener('click',()=>{step--;draw()});document.querySelector('#next').onclick=()=>{let v=document.querySelector('#setupInput').value;if(f[1]==='bedtime'&&!v){alert('Bedtime target is required.');return} if(f[2]==='number')v=+v; if(f[1]==='babyName')db.profile.babyName=v;else db.settings[f[1]]=v;f[3]=v;if(step<fields.length-1){step++;draw()}else{db.setupComplete=true;save();render()}}}
 draw()}
function navBar(){nav.innerHTML=`<nav class="nav"><div class="nav-inner">${[['today','Today'],['history','History'],['settings','Settings']].map(([k,l])=>`<button data-v="${k}" class="${view===k?'active':''}">${l}</button>`).join('')}</div></nav>`;nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function status(e){return e.state==='actual'?'Actual':e.locked?'Locked':e.state==='autoCompleted'?'Auto-Completed':'Projected'}
function eventHTML(e){let st=e.actualStart??e.start;return `<div class="event" data-id="${e.id}"><div class="time">${time(st)}</div><div><div class="event-title">${esc(e.title)}</div>${e.duration&&!(e.type==='activity'&&db.advanced.activityDurationDisplay===false)?`<div class="meta">${e.duration} mins${e.type==='feed'?' · start-to-start interval':''}</div>`:''}</div><span class="state ${e.state==='actual'?'actual':e.locked?'locked':''}">${status(e)}</span></div>`}
function timelineHTML(d){let out='',prevNapEnd=d.events.find(e=>e.type==='goodMorning')?.actualStart??d.events.find(e=>e.type==='goodMorning')?.start;for(let e of d.events){let st=e.actualStart??e.start;if(e.type==='nap'&&prevNapEnd!=null)out+=`<div class="ww">Wake Window · ${Math.max(0,st-prevNapEnd)} mins</div>`;if(e.type==='goodnight'&&prevNapEnd!=null&&d.events.some(x=>x.type==='nap'))out+=`<div class="ww">Final Wake Window · ${Math.max(0,st-prevNapEnd)} mins</div>`;out+=eventHTML(e);if(e.type==='nap')prevNapEnd=e.actualEnd??(st+(e.duration||0))}return out}
function conflictHTML(d){if(!d.conflicts.length)return '';let c=d.conflicts[0],msg=typeof c==='string'?c:c.message,choices=typeof c==='string'?[]:(c.choices||[]);let labels={skip:'Skip final nap',shorten:'Shorten below minimum',push:'Push bedtime later'};return `<div class="notice"><strong>Unresolved conflict</strong><br>${esc(msg)}${choices.length?`<div class="conflict-actions">${choices.map(x=>`<button data-resolve="${x}" class="secondary">${labels[x]}</button>`).join('')}</div>`:''}</div>`}
function today(){if(!db.currentDay)return `<div class="top"><div><h1>Today</h1><div class="muted">${db.profile.babyName?esc(db.profile.babyName)+"'s ":''}BabyFlow Day</div></div><span class="badge">BF2 v1.0.1</span></div><div class="card"><h2>Start today's BabyFlow</h2><p class="muted">A new BabyFlow Day begins with Good Morning—not at midnight.</p><label>Actual Good Morning<input id="gmStart" type="time" value="${db.settings.goodMorning||''}"></label><button class="fab" id="startDay">Start BabyFlow Day</button></div>`;
 let d=db.currentDay;return `<div class="top"><div><h1>Today</h1><div class="muted">${new Date(d.startedAt).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div></div><span class="badge">BF2 v1.0.1</span></div>${conflictHTML(d)}<div class="card">${timelineHTML(d)}</div><button class="fab" id="add">+ Add to Timeline</button><button class="secondary fab" id="newMorning">Next Good Morning / Start New Day</button>`}
function history(){return `<div class="top"><div><h1>History</h1><div class="muted">Previous BabyFlow Days are kept indefinitely.</div></div></div>${db.history.length?db.history.slice().reverse().map(d=>`<div class="card history-day"><div class="row between"><strong>${new Date(d.startedAt).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</strong><span class="pill">${d.events.length} events</span></div><div class="small muted" style="margin-top:8px">Good Morning ${time(mins(d.goodMorningActual))} · ${d.events.filter(e=>e.state==='actual').length} Actual</div></div>`).join(''):'<div class="card muted">No previous BabyFlow Days yet.</div>'}`}
function settings(){let s=db.settings;return `<div class="top"><div><h1>Settings</h1><div class="muted">Scheduling defaults</div></div></div><div class="card stack"><label>Baby name<input data-profile="babyName" value="${esc(db.profile.babyName)}"></label><div class="grid2"><label>Good Morning target<input data-set="goodMorning" type="time" value="${s.goodMorning}"></label><label>Bedtime target<input data-set="bedtime" type="time" value="${s.bedtime}" required></label></div><div class="grid2"><label>Feed interval (min)<input data-set="feedInterval" inputmode="numeric" value="${esc(s.feedInterval)}" placeholder="e.g. 60 or 55-65"></label><label>Feed duration (min)<input data-set="feedDuration" inputmode="numeric" value="${esc(s.feedDuration)}" placeholder="e.g. 60 or 55-65"></label></div><div class="grid2"><label>Wake window (min)<input data-set="wakeWindow" inputmode="numeric" value="${esc(s.wakeWindow)}" placeholder="e.g. 60 or 55-65"></label><label>Nap duration (min)<input data-set="napDuration" inputmode="numeric" value="${esc(s.napDuration)}" placeholder="e.g. 60 or 55-65"></label></div><label>Minimum cat nap (min)<input data-set="minCatNap" type="number" value="${s.minCatNap}"></label><label>Extra Feed duration (min or range)<input data-set="extraFeedDuration" inputmode="numeric" value="${esc(s.extraFeedDuration)}" placeholder="e.g. 10 or 5-10"></label><button id="saveSettings">Save Settings</button><button class="secondary" id="exceptions">Position Exceptions</button></div><h2 class="section-title">Data</h2><div class="card stack"><button class="secondary" id="advanced">Advanced Settings</button><button class="ghost" id="export">Export Backup</button><label class="ghost" style="padding:11px 14px;border-radius:13px;text-align:center;cursor:pointer;color:var(--ink)">Import / Restore Backup<input id="import" type="file" accept="application/json" class="hidden"></label></div><div class="small muted">BF2 uses its own storage namespace and does not read or modify BabyFlow 1 data.</div>`}
function modal(html){document.querySelector('#modal').innerHTML=`<div class="modal" id="shade"><div class="sheet">${html}</div></div>`;document.querySelector('#shade').onclick=e=>{if(e.target.id==='shade')closeModal()}}
function closeModal(){document.querySelector('#modal').innerHTML=''}
function addSheet(){let acts=db.activities.builtins.filter(x=>!db.activities.hidden.includes(x)).concat(db.activities.custom);modal(`<h2>Add to Timeline</h2><div class="stack"><button data-add="feed">Full Feed</button><button data-add="extraFeed" class="secondary">Extra Feed</button><button data-add="dreamFeed" class="secondary">Dream Feed</button><button data-add="nap" class="secondary">Nap</button>${acts.map(a=>`<button data-act="${esc(a)}" class="ghost">${esc(a)}</button>`).join('')}<button data-act="Custom Activity" class="ghost">Custom Activity</button></div>`);document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addStructural(b.dataset.add));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>addActivity(b.dataset.act))}
function addStructural(type){let label={feed:'Full Feed',extraFeed:'Extra Feed',dreamFeed:'Dream Feed',nap:'Nap'}[type];modal(`<h2>Add ${label}</h2><div class="stack"><label>Start time<input id="xstart" type="time"></label><button id="xadd">Add</button></div>`);document.querySelector('#xadd').onclick=()=>{let st=mins(document.querySelector('#xstart').value);if(st==null)return;let count=db.currentDay.events.filter(e=>e.type===type).length+1,dur=type==='nap'?effective('napDuration'):type==='extraFeed'?effective('extraFeedDuration'):effective('feedDuration'),title=type==='nap'?`Nap ${count}`:type==='dreamFeed'?`Dream Feed ${count}`:type==='extraFeed'?'Extra Feed':`Feed ${db.currentDay.events.filter(e=>e.type==='feed').length+1}`;db.currentDay.events.push(event(type,title,st,dur,'projected',type==='extraFeed'?{resetsInterval:!!db.settings.extraFeedResetsInterval}:type==='dreamFeed'?{resetsInterval:true}:{}));reconcileDay(db.currentDay);save();closeModal();render()}}
function addActivity(name){modal(`<h2>Add Activity</h2><div class="stack">${name==='Custom Activity'?'<label>Name<input id="aname"></label>':''}<label>Start time<input id="astart" type="time"></label><label>End time (optional)<input id="aend" type="time"></label><button id="aadd">Add Activity</button></div>`);document.querySelector('#aadd').onclick=()=>{let title=name==='Custom Activity'?document.querySelector('#aname').value.trim():name,st=mins(document.querySelector('#astart').value),en=mins(document.querySelector('#aend').value);if(!title||st==null)return;let dur=en==null?null:(en<st?en+1440:en)-st;let collision=dur&&db.currentDay.events.some(e=>e.duration&&st<e.start+e.duration&&st+dur>e.start);if(collision){alert('That time span overlaps another timeline event. Please change the timing.');return}db.currentDay.events.push(event('activity',title,st,dur,'projected',{locked:true}));db.currentDay.events.sort((a,b)=>a.start-b.start);save();closeModal();render()}}
function editEvent(id){let e=db.currentDay.events.find(x=>x.id===id);if(!e)return;let st=e.actualStart??e.start;modal(`<h2>${esc(e.title)}</h2><div class="stack"><label>Start time<input id="estart" type="time" value="${String(Math.floor((st%1440)/60)).padStart(2,'0')}:${String(st%60).padStart(2,'0')}"></label>${e.duration!=null?`<label>Duration (minutes)<input id="edur" type="number" value="${e.duration}"></label><label>Actual end (optional)<input id="eend" type="time" value="${e.actualEnd!=null?`${String(Math.floor((e.actualEnd%1440)/60)).padStart(2,'0')}:${String(e.actualEnd%60).padStart(2,'0')}`:''}"></label>`:''}<label><span><input id="elock" type="checkbox" style="width:auto" ${e.locked?'checked':''}> Lock entire projected event</span></label><div class="grid2"><label><span><input id="lockStart" type="checkbox" style="width:auto" ${e.locks?.start?'checked':''}> Lock start only</span></label><label><span><input id="lockDur" type="checkbox" style="width:auto" ${e.locks?.duration?'checked':''}> Lock duration only</span></label></div><button id="markActual">${e.state==='actual'?'Save Actual correction':'Mark Actual / Start at this time'}</button>${e.duration!=null?'<button class="secondary" id="endNow">End Now</button>':''}<button class="secondary" id="saveProjected">Save projected time</button>${['feed','dreamFeed','nap'].includes(e.type)?'<button class="ghost" id="dayOverride">One-day rule override</button>':''}${!['goodMorning','goodnight'].includes(e.type)?'<button class="danger" id="deleteEvent">Delete event</button>':''}</div>`);
 document.querySelector('#saveProjected').onclick=()=>{let ns=mins(document.querySelector('#estart').value);if(ns==null)return;if(e.state==='actual'&&!confirm('This event is Actual. Save this as a correction to the Actual start time?'))return;e.start=ns;e.locked=document.querySelector('#elock').checked;e.locks={start:document.querySelector('#lockStart').checked,duration:document.querySelector('#lockDur').checked};if(e.duration!=null)e.duration=+document.querySelector('#edur').value||0;if(e.state==='actual')e.actualStart=ns;reconcileDay(db.currentDay);save();closeModal();render()};
 document.querySelector('#markActual').onclick=()=>{let ns=mins(document.querySelector('#estart').value);if(ns==null)return;e.projectedStart=e.projectedStart??e.start;e.projectedDuration=e.projectedDuration??e.duration;e.actualStart=ns;e.start=ns;e.state='actual';e.locked=false;e.locks={start:false,duration:e.locks?.duration||false};if(e.duration!=null){e.duration=+document.querySelector('#edur').value||0;let ee=document.querySelector('#eend')?.value;e.actualEnd=ee?mins(ee):e.actualEnd}reconcileDay(db.currentDay);save();closeModal();render()};
 document.querySelector('#dayOverride')?.addEventListener('click',()=>{let key=e.type==='nap'?'napDuration':'feedDuration',cur=(db.currentDay.overrides||[]).find(o=>o.eventId===e.id)||{};let val=prompt('Temporary '+(key==='napDuration'?'nap duration':'feed duration')+' for today (minutes or range):',cur[key]||'');if(val===null)return;db.currentDay.overrides=(db.currentDay.overrides||[]).filter(o=>o.eventId!==e.id);if(val.trim())db.currentDay.overrides.push({eventId:e.id,[key]:val.trim()});reconcileDay(db.currentDay);save();closeModal();render()});document.querySelector('#endNow')?.addEventListener('click',()=>{let now=new Date(),m=now.getHours()*60+now.getMinutes();e.projectedStart=e.projectedStart??e.start;e.projectedDuration=e.projectedDuration??e.duration;e.actualStart=e.actualStart??(mins(document.querySelector('#estart').value)??e.start);e.actualEnd=m;e.state='actual';e.locked=false;reconcileDay(db.currentDay);save();closeModal();render()});document.querySelector('#deleteEvent')?.addEventListener('click',()=>{if(e.state==='actual'&&!confirm('Delete this Actual event? This correction cannot affect other historical days.'))return;if(e.state!=='actual'&&!confirm('Delete this event?'))return;db.currentDay.events=db.currentDay.events.filter(x=>x.id!==id);reconcileDay(db.currentDay);save();closeModal();render()})}
function resolveConflict(choice){let d=db.currentDay,c=d.conflicts.find(x=>typeof x!=='string'&&x.code==='bedtime-fit');if(!c)return;let naps=d.events.filter(e=>e.type==='nap').sort((a,b)=>a.start-b.start),last=naps[naps.length-1],gn=d.events.find(e=>e.type==='goodnight'),ww=effective('wakeWindow');if(choice==='skip'&&last&&last.state!=='actual'&&!last.locked)d.events=d.events.filter(e=>e.id!==last.id);else if(choice==='shorten'&&last&&last.state!=='actual'&&!last.locked){last.duration=Math.max(1,(gn.actualStart??gn.start)-ww-(last.actualStart??last.start));d.overrides.push({type:'napBelowMinimum',eventId:last.id})}else if(choice==='push'&&gn.state!=='actual'&&!gn.locked){let le=(last.actualStart??last.start)+(last.duration||0);gn.start=le+ww;d.overrides.push({type:'bedtimeLater',minutes:gn.start-mins(db.settings.bedtime)})}reconcileDay(d);save();render()}
function exceptions(){let ex=db.settings.exceptions||(db.settings.exceptions={feeds:{},naps:{},wakeWindows:{}});modal(`<h2>Position Exceptions</h2><p class="muted">Optional V1 overrides by current display position. Leave blank to use the default rule.</p><div class="stack"><label>Feed number<input id="exFeedPos" type="number" min="1" value="1"></label><label>Feed interval (min or range)<input id="exFeedInt" placeholder="e.g. 140-160"></label><label>Feed duration (min or range)<input id="exFeedDur" placeholder="e.g. 15-20"></label><hr><label>Nap number<input id="exNapPos" type="number" min="1" value="1"></label><label>Wake window before nap (min or range)<input id="exWW" placeholder="e.g. 55-65"></label><label>Nap duration (min or range)<input id="exNapDur" placeholder="e.g. 50-75"></label><button id="saveEx">Save Exceptions</button></div>`);let loadEx=()=>{let fp=+document.querySelector('#exFeedPos').value||1,np=+document.querySelector('#exNapPos').value||1,f=ex.feeds[fp]||{},n=ex.naps[np]||{},w=ex.wakeWindows[np]||{};document.querySelector('#exFeedInt').value=f.feedInterval||'';document.querySelector('#exFeedDur').value=f.feedDuration||'';document.querySelector('#exWW').value=w.wakeWindow||'';document.querySelector('#exNapDur').value=n.napDuration||''};document.querySelector('#exFeedPos').onchange=loadEx;document.querySelector('#exNapPos').onchange=loadEx;loadEx();document.querySelector('#saveEx').onclick=()=>{let fp=+document.querySelector('#exFeedPos').value||1,np=+document.querySelector('#exNapPos').value||1;ex.feeds[fp]={feedInterval:document.querySelector('#exFeedInt').value.trim(),feedDuration:document.querySelector('#exFeedDur').value.trim()};ex.wakeWindows[np]={wakeWindow:document.querySelector('#exWW').value.trim()};ex.naps[np]={napDuration:document.querySelector('#exNapDur').value.trim()};if(db.currentDay)reconcileDay(db.currentDay);save();closeModal();render()}}
function advanced(){modal(`<h2>Advanced Settings</h2><p class="muted">Granular controls live here so everyday Settings stay simple.</p><div class="stack"><label>Optimization adjustment distribution<select id="dist"><option value="later">Later First</option><option value="earlier">Earlier First</option><option value="spread">Spread</option></select></label><label><span><input id="elapsed" type="checkbox" style="width:auto"> Show elapsed wake-window timer</span></label><label><span><input id="remaining" type="checkbox" style="width:auto"> Show remaining wake-window timer</span></label><label><span><input id="auto" type="checkbox" style="width:auto"> Auto-complete Activities</span></label><label><span><input id="extraReset" type="checkbox" style="width:auto"> Extra Feed resets feed interval</span></label><label><span><input id="actDur" type="checkbox" style="width:auto"> Show Activity durations</span></label><button id="advSave">Save</button></div>`);document.querySelector('#dist').value=db.advanced.adjustmentDistribution;document.querySelector('#elapsed').checked=db.advanced.showElapsed;document.querySelector('#remaining').checked=db.advanced.showRemaining;document.querySelector('#auto').checked=db.advanced.activityAutoComplete;document.querySelector('#extraReset').checked=!!db.settings.extraFeedResetsInterval;document.querySelector('#actDur').checked=db.advanced.activityDurationDisplay!==false;document.querySelector('#advSave').onclick=()=>{db.advanced.adjustmentDistribution=document.querySelector('#dist').value;db.advanced.showElapsed=document.querySelector('#elapsed').checked;db.advanced.showRemaining=document.querySelector('#remaining').checked;db.advanced.activityAutoComplete=document.querySelector('#auto').checked;db.settings.extraFeedResetsInterval=document.querySelector('#extraReset').checked;db.advanced.activityDurationDisplay=document.querySelector('#actDur').checked;save();closeModal()}}
function bind(){if(view==='today'){document.querySelector('#startDay')?.addEventListener('click',()=>{let gm=document.querySelector('#gmStart').value;if(!gm){alert('Enter the Actual Good Morning time to start the day.');return}db.currentDay=generateDay(gm);save();render()});document.querySelector('#add')?.addEventListener('click',addSheet);document.querySelectorAll('.event[data-id]').forEach(x=>x.onclick=()=>editEvent(x.dataset.id));document.querySelectorAll('[data-resolve]').forEach(x=>x.onclick=()=>resolveConflict(x.dataset.resolve));document.querySelector('#newMorning')?.addEventListener('click',()=>{modal(`<h2>Start the next BabyFlow Day</h2><p class="muted">The current day will move to History. A calendar-date change alone never does this.</p><label>Actual Good Morning<input id="nextgm" type="time" value="${db.settings.goodMorning||''}"></label><button class="fab" id="confirmNext">Start New Day</button>`);document.querySelector('#confirmNext').onclick=()=>{let gm=document.querySelector('#nextgm').value;if(!gm)return;db.history.push(db.currentDay);db.currentDay=generateDay(gm);save();closeModal();render()}})}
if(view==='settings'){document.querySelector('#saveSettings').onclick=()=>{document.querySelectorAll('[data-set]').forEach(i=>db.settings[i.dataset.set]=i.type==='number'?+i.value:i.value.trim());db.profile.babyName=document.querySelector('[data-profile="babyName"]').value.trim();if(db.currentDay)reconcileDay(db.currentDay);save();render();alert('Settings saved. Existing Actuals and Locks were preserved.')};document.querySelector('#advanced').onclick=advanced;document.querySelector('#exceptions').onclick=exceptions;document.querySelector('#export').onclick=()=>{let blob=new Blob([JSON.stringify({app:APP,schema:SCHEMA,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`babyflow2-backup-${isoDay()}.json`;a.click();URL.revokeObjectURL(a.href)};document.querySelector('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let b=JSON.parse(r.result);if(b.app!==APP||b.schema!==SCHEMA||!b.data)throw 0;if(!confirm('Restore this BF2 backup? This replaces current BF2 data.'))return;localStorage.setItem(KEY+':pre-restore:'+Date.now(),JSON.stringify(db));db=b.data;save();render()}catch{alert('That is not a valid compatible BabyFlow 2 backup. Nothing was changed.')}};r.readAsText(f)}}}
function render(){if(!db.setupComplete){setup();return}navBar();app.innerHTML=view==='today'?today():view==='history'?history():settings();bind()}
render();
})();
</script></body></html>
