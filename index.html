<body><main id="app" class="app"></main><div id="nav"></div><div id="modal"></div>
<script>
(()=>{
'use strict';
const APP='babyflow2', SCHEMA=3, KEY='babyflow2:v3:data';
const uid=()=>crypto.randomUUID?.()||('bf2-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const defaults=()=>({schema:SCHEMA,profile:{babyName:''},setupComplete:false,settings:{goodMorning:'',bedtime:'20:00',feedDuration:'20',feedInterval:'150',wakeWindow:'60',napDuration:'60',extraFeedDuration:'10',dreamFeedDuration:'20',dreamFeedTimes:'',dreamFeedTargets:[],minCatNap:20,extraFeedResetsInterval:false,exceptions:{feeds:{},naps:{},wakeWindows:{}}},advanced:{goodMorningRangePoint:'beginning',feedRangePoint:'beginning',feedIntervalRangePoint:'beginning',feedDurationRangePoint:'beginning',wakeRangePoint:'middle',napRangePoint:'middle',bedtimeRangePoint:'beginning',extraFeedRangePoint:'middle',dreamFeedRangePoint:'beginning',showElapsed:false,showRemaining:false,adjustmentDistribution:'later',activityAutoComplete:false,activityDurationDisplay:true,showBedtimeResolutionNotice:true,showTimelineLocks:true},activities:{builtins:['Bath','Dry off / Lotion / PJs','Tummy Time','Walk','Play'],custom:[],hidden:[],order:[],orderMode:'alphabetical'},currentDay:null,history:[],meta:{createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}});
function validStoredDay(d){
 if(!d||typeof d!=='object'||!Array.isArray(d.events)||d.events.length>5000)return false;
 const seen=new Set();
 for(const e of d.events){
  if(!e||typeof e.id!=='string'||!e.id||seen.has(e.id)||typeof e.type!=='string'||typeof e.title!=='string')return false;
  seen.add(e.id);
  if(!Number.isFinite(e.start)||e.start<0||e.start>10080)return false;
  if(e.actualStart!=null&&(!Number.isFinite(e.actualStart)||e.actualStart<0||e.actualStart>10080))return false;
  if(e.actualEnd!=null&&(!Number.isFinite(e.actualEnd)||e.actualEnd<0||e.actualEnd>10080))return false;
  if(e.duration!=null&&(!Number.isFinite(e.duration)||e.duration<0||e.duration>1440))return false;
  if(e.detachedDreamDuration!=null&&(!Number.isSafeInteger(e.detachedDreamDuration)||e.detachedDreamDuration<0||e.detachedDreamDuration>1440||e.type!=='dreamFeed'))return false;
  // One-day edits for configured Dream Feeds are stored separately from the
  // reusable target. Validate these before trusting an imported backup.
  if(e.userDreamEditStart!=null&&(!Number.isSafeInteger(e.userDreamEditStart)||e.userDreamEditStart<0||e.userDreamEditStart>10080||e.type!=='dreamFeed'))return false;
  if(e.userDreamEditDuration!=null&&(!Number.isSafeInteger(e.userDreamEditDuration)||e.userDreamEditDuration<0||e.userDreamEditDuration>1440||e.type!=='dreamFeed'))return false;
  if(e.lockedEnd!=null&&(!Number.isSafeInteger(e.lockedEnd)||e.lockedEnd<0||e.lockedEnd>11520))return false;
  if(e.locks?.end===true&&(e.duration==null||!Number.isSafeInteger(e.lockedEnd)))return false;
  if(!['projected','actual','autoCompleted'].includes(e.state))return false;
 }
 if(d.overrides!=null&&!Array.isArray(d.overrides))return false;
 if(d.conflicts!=null&&!Array.isArray(d.conflicts))return false;
 if(d.notices!=null&&(!Array.isArray(d.notices)||d.notices.length>30||d.notices.some(n=>!n||typeof n.message!=='string')))return false;
 return true;
}
function validBF2Data(x){
 if(!x||typeof x!=='object'||x.schema!==SCHEMA||!x.settings||typeof x.settings!=='object'||!x.profile||typeof x.profile!=='object')return false;
 if(!clockSpec(x.settings.bedtime,'beginning'))return false;
 // A blank Good Morning target is valid: the Actual Good Morning starts the
 // BabyFlow Day. A *nonblank* target must still be a valid clock/range.
 if(x.settings.goodMorning!=null&&String(x.settings.goodMorning).trim()!==''&&
    !clockSpec(x.settings.goodMorning,'beginning'))return false;
 // Legacy schema-3 backups may omit newer optional settings. When provided,
 // these values must be sensible before any saved data is replaced.
 if(x.settings.minCatNap!=null){
  const rawCat=x.settings.minCatNap;
  if(!(typeof rawCat==='number'||(typeof rawCat==='string'&&/^\d+$/.test(rawCat.trim())))||
     !Number.isSafeInteger(Number(rawCat))||
     Number(rawCat)<1||Number(rawCat)>1440)return false;
 }
 if(x.settings.dreamFeedDuration!=null&&String(x.settings.dreamFeedDuration).trim()!==''&&
    (!rangeSpec(x.settings.dreamFeedDuration)||rangeSpec(x.settings.dreamFeedDuration).min<1))return false;
 if(x.settings.dreamFeedTargets!=null){
  if(!Array.isArray(x.settings.dreamFeedTargets)||x.settings.dreamFeedTargets.length>24)return false;
  const ids=new Set();for(const entry of x.settings.dreamFeedTargets){
   if(!entry||typeof entry.id!=='string'||!entry.id||ids.has(entry.id)||!clockSpec(entry.target,'beginning'))return false;
   ids.add(entry.id);
   if(entry.duration&&(!rangeSpec(entry.duration)||rangeSpec(entry.duration).min<1))return false;
  }
 }
 for(const key of ['feedInterval','feedDuration','wakeWindow','napDuration','extraFeedDuration']){
  let r=rangeSpec(x.settings[key]);if(!r||r.min<1)return false;
 }
 if(!Array.isArray(x.history)||x.history.length>50000||!x.history.every(validStoredDay))return false;
 if(x.currentDay!=null&&!validStoredDay(x.currentDay))return false;
 if(x.advanced!=null&&(typeof x.advanced!=='object'||Array.isArray(x.advanced)))return false;
 if(x.activities!=null&&(typeof x.activities!=='object'||Array.isArray(x.activities)))return false;
 const rules=x.settings.exceptions?.rules;
 if(rules!=null){
  if(!Array.isArray(rules)||rules.length>500)return false;
  const known=['feedInterval','feedDuration','wakeWindow','napDuration'];
  if(rules.some(r=>!r||typeof r.id!=='string'||!known.includes(r.key)||(!['position','last','afterActual','afterDreamReset','afterExtraReset'].includes(r.mode)||(['afterDreamReset','afterExtraReset'].includes(r.mode)&&!['feedInterval','feedDuration'].includes(r.key)))||!rangeSpec(r.value)||rangeSpec(r.value).min<1||(r.mode==='position'&&(!Number.isSafeInteger(Number(r.position))||+r.position<1))))return false;
 }
 if(x.currentDay?.exceptionResolutions!=null&&!Array.isArray(x.currentDay.exceptionResolutions))return false;
 return true;
}
// Storage failures must never silently replace unreadable data or claim that a
// restore was saved. These flags are intentionally outside the saved BF2 schema.
let storageRecovery=null,storageWriteWarning='';
function load(){
 let raw=null;
 try{
  raw=localStorage.getItem(KEY);if(raw==null)return defaults();
  const x=JSON.parse(raw);
  if(!validBF2Data(x))throw new Error('Invalid BF2 saved state');
  return x;
 }catch(err){
  let copied=false,key='';
  if(raw!=null){
   try{
    // Stable recovery filename avoids creating a fresh duplicate on every reload.
    let hash=2166136261;
    for(let i=0;i<raw.length;i++)hash=Math.imul(hash^raw.charCodeAt(i),16777619);
    key=KEY+':unreadable-recovery:'+(hash>>>0).toString(16)+'-'+raw.length;
    const existing=localStorage.getItem(key);
    if(existing!==raw){
     if(existing!=null)key+='-'+Math.random().toString(36).slice(2,8);
     localStorage.setItem(key,raw);
    }
    copied=localStorage.getItem(key)===raw;
   }catch{} 
  }
  storageRecovery={raw,copySaved:copied,copyKey:copied?key:null,readError:raw==null};
  // Keep the existing KEY intact. Only an explicit, confirmed recovery action
  // may replace it. The temporary defaults are deliberately read-only.
  return defaults();
 }
}
let db=load(), view='today', showAllConflicts=false;
// Keep a downloadable copy of an attempted change if browser storage rejects it.
// The live app itself always returns to the last verified saved state.
let unsavedDataCandidate=null;
// Additive migration: keep the existing BF2 storage key/schema and every saved Actual,
// Lock, History item and one-day decision. Older saves had a single shared feed point.
function migratePreferences(d){
 d.advanced=d.advanced||{};
 d.settings=d.settings||{};
 // Older schema-3 saves can legitimately lack this setting. Default it
 // during migration rather than turning a compatible backup into an error.
 if(d.settings.minCatNap==null)d.settings.minCatNap=20;
 if(!Array.isArray(d.settings.dreamFeedTargets)){
  const legacy=String(d.settings.dreamFeedTimes||'').split(/[;,]/).map(x=>x.trim()).filter(Boolean);
  d.settings.dreamFeedTargets=legacy.filter(x=>clockSpec(x,'beginning')).map((target,i)=>({id:'legacy-dream-'+i,target,duration:''}));
 }
 d.settings.dreamFeedTargets=d.settings.dreamFeedTargets.filter(x=>x&&typeof x.id==='string'&&typeof x.target==='string'&&clockSpec(x.target,'beginning')).map(x=>({id:x.id,target:x.target,duration:typeof x.duration==='string'?x.duration:''}));
 if(d.settings.exceptions&&!Array.isArray(d.settings.exceptions.rules))d.settings.exceptions.rules=[];
 const base=d.advanced.feedRangePoint||'beginning';
 if(!['beginning','middle','end'].includes(d.advanced.feedIntervalRangePoint))d.advanced.feedIntervalRangePoint=base;
 if(!['beginning','middle','end'].includes(d.advanced.feedDurationRangePoint))d.advanced.feedDurationRangePoint=base;
 if(!['beginning','middle','end'].includes(d.advanced.dreamFeedRangePoint))d.advanced.dreamFeedRangePoint='beginning';
 if(d.advanced.showBedtimeResolutionNotice==null)d.advanced.showBedtimeResolutionNotice=true;
 if(d.advanced.showTimelineLocks==null)d.advanced.showTimelineLocks=true;
 d.activities=d.activities||{builtins:['Bath','Dry off / Lotion / PJs','Tummy Time','Walk','Play'],custom:[],hidden:[]};
 d.activities.builtins=Array.isArray(d.activities.builtins)?d.activities.builtins:[];
 d.activities.custom=Array.isArray(d.activities.custom)?d.activities.custom.map(x=>typeof x==='string'?x:x?.name).filter(x=>typeof x==='string'&&x.trim()):[];
 d.activities.hidden=Array.isArray(d.activities.hidden)?d.activities.hidden:[];
 d.activities.order=Array.isArray(d.activities.order)?d.activities.order:[];
 if(!['alphabetical','custom'].includes(d.activities.orderMode))d.activities.orderMode='alphabetical';
 if(d.advanced.confirmActivityDelete==null)d.advanced.confirmActivityDelete=true;
 if(d.advanced.warnWhenEditingLocked==null)d.advanced.warnWhenEditingLocked=true;
 if(d.advanced.warnWhenActualDiffersFromLock==null)d.advanced.warnWhenActualDiffersFromLock=true;
 d.meta=d.meta||{};
 if(d.advanced.notifyRoutineAdjustments==null)d.advanced.notifyRoutineAdjustments=false;
 if(d.advanced.notifyOverrideRestored==null)d.advanced.notifyOverrideRestored=true;
 for(const day of [d.currentDay,...(d.history||[])].filter(Boolean)){
  if(!Array.isArray(day.notices))day.notices=[];
  if(!Array.isArray(day.exceptionResolutions))day.exceptionResolutions=[];
 }
 return d;
}
migratePreferences(db);
function save(){
 if(storageRecovery){
  storageWriteWarning='Existing BF2 data needs recovery. Changes cannot be saved until a compatible backup is restored or you explicitly start fresh.';
  alert(storageWriteWarning);return false;
 }
 let previousRaw;
 try{previousRaw=localStorage.getItem(KEY)}catch(err){
  // Save the proposed edit for a manual export even if existing storage cannot be read.
  try{unsavedDataCandidate=JSON.stringify({app:APP,schema:SCHEMA,exportedAt:new Date().toISOString(),data:db})}catch{unsavedDataCandidate=null}
  // We cannot establish what is safely stored. Never continue editing a guess.
  storageRecovery={raw:null,copySaved:false,copyKey:null,readError:true,reason:'failedSave'};
  storageWriteWarning='BF2 could not verify the previously saved data. Normal editing has been paused to protect it.';
  alert(storageWriteWarning);return false;
 }
 const previousTimestamp=db.meta.updatedAt;
 let attemptedRaw=null;
 try{
  db.meta.updatedAt=new Date().toISOString();
  attemptedRaw=JSON.stringify(db);
  localStorage.setItem(KEY,attemptedRaw);
  if(localStorage.getItem(KEY)!==attemptedRaw)throw new Error('Storage verification failed');
  storageWriteWarning='';unsavedDataCandidate=null;return true;
 }catch(err){
  db.meta.updatedAt=previousTimestamp;
  // Preserve the attempted change for download, but do not display it as saved.
  try{unsavedDataCandidate=JSON.stringify({app:APP,schema:SCHEMA,exportedAt:new Date().toISOString(),data:db})}catch{unsavedDataCandidate=null}
  let verified=false;
  try{
   if(previousRaw==null){
    // No existing key (e.g., first setup). Ensure there is still no key.
    if(localStorage.getItem(KEY)!=null)localStorage.removeItem(KEY);
    verified=localStorage.getItem(KEY)==null;
    if(verified)db=defaults();
   }else{
    if(localStorage.getItem(KEY)!==previousRaw)localStorage.setItem(KEY,previousRaw);
    verified=localStorage.getItem(KEY)===previousRaw;
    if(verified){
     const restored=JSON.parse(previousRaw);
     if(validBF2Data(restored))db=migratePreferences(restored);
     else verified=false;
    }
   }
  }catch{verified=false}
  if(!verified){
   storageRecovery={raw:previousRaw??null,copySaved:false,copyKey:null,readError:previousRaw==null,reason:'failedSave'};
   storageWriteWarning='BF2 could not verify the previous saved state after this failed save. Normal editing has been paused. No successful save is being claimed.';
  }else{
   storageWriteWarning='BF2 could not save that change. The app has returned to the last verified saved state. If needed, download the rejected change separately before trying again.';
  }
  alert(storageWriteWarning);return false;
 }
}
function downloadTextFile(name,content){
 const blob=new Blob([content],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 // Revoking in the same event turn can cancel downloads on iOS Safari.
 setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function exportBackup(){
 downloadTextFile(`babyflow2-backup-${isoDay()}.json`,JSON.stringify({app:APP,schema:SCHEMA,exportedAt:new Date().toISOString(),data:db},null,2));
}
// Commit the restored state only AFTER its bytes are durably stored. A
// byte-for-byte pre-restore backup is mandatory whenever KEY already exists.
function restoreBackupText(text){
 let candidate;
 try{
  const b=JSON.parse(text);
  if(!b||b.app!==APP||b.schema!==SCHEMA||!validBF2Data(b.data))throw new Error('Incompatible backup');
  candidate=migratePreferences(JSON.parse(JSON.stringify(b.data)));
  if(!validBF2Data(candidate))throw new Error('Invalid migrated backup');
 }catch(err){return {ok:false,error:'This is not a valid compatible BabyFlow 2 backup. Nothing was changed.'}}
 if(!confirm('Restore this BF2 backup? This will replace the current BabyFlow 2 data after a separate pre-restore copy is saved.'))return {ok:false,cancelled:true};
 let oldRaw,backupKey=null;
 try{
  oldRaw=localStorage.getItem(KEY);
  if(oldRaw!=null){
   backupKey=KEY+':pre-restore:'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
   localStorage.setItem(backupKey,oldRaw);
   if(localStorage.getItem(backupKey)!==oldRaw)throw new Error('Cannot verify pre-restore backup');
  }
 }catch(err){return {ok:false,error:'Restore stopped: the original BF2 data could not be backed up safely. Nothing was replaced. Export the existing data or free device storage and try again.'}}
 const encoded=JSON.stringify(candidate);
 try{
  localStorage.setItem(KEY,encoded);
  if(localStorage.getItem(KEY)!==encoded)throw new Error('Cannot verify restored data');
 }catch(err){
  let recovered=false;
  try{
   if(oldRaw!=null){localStorage.setItem(KEY,oldRaw);recovered=localStorage.getItem(KEY)===oldRaw}
   else{localStorage.removeItem(KEY);recovered=localStorage.getItem(KEY)==null}
  }catch{}
  if(!recovered){
   // An uncertain write is never safe to resume normal editing on.
   storageRecovery={raw:oldRaw??null,copySaved:!!backupKey,copyKey:backupKey,readError:false,reason:'failedRestore'};
  }
  return {ok:false,error:recovered?'Restore failed (possibly insufficient storage). Your previous BF2 data was restored; no new data was committed.':'Restore failed and the original data could not be verified. BF2 has stopped normal editing. Download the preserved data and use a backup to recover.'};
 }
 db=candidate;storageRecovery=null;storageWriteWarning='';unsavedDataCandidate=null;view='today';
 return {ok:true,backupKey};
}
function selectBackupFile(input){
 const f=input.files?.[0];if(!f)return;
 const reader=new FileReader();
 reader.onerror=()=>alert('This backup file could not be read. No BF2 data was changed.');
 reader.onload=()=>{
  const result=restoreBackupText(String(reader.result??''));
  if(result.ok)render();else if(result.error){alert(result.error);if(storageRecovery)render()}
 };
 reader.readAsText(f);
}
function recoveryScreen(){
 nav.innerHTML='';
 const copyStatus=storageRecovery?.copySaved?'A separate browser recovery copy was verified.':'A separate recovery copy could NOT be verified.';
 const problem=storageRecovery.reason==='failedRestore'?'A restore was interrupted, and BF2 could not verify its original stored data. The storage key might have changed.':storageRecovery.reason==='failedSave'?'A save failed, and BF2 could not verify that the previously stored state was safely restored.':'BF2 cannot safely read its saved data. It has not overwritten the original storage key.';
 app.innerHTML=`<div class="setup"><span class="badge">BabyFlow 2 · Recovery</span><h1 style="margin-top:12px">Your saved BF2 data needs attention</h1><div class="notice">${esc(problem)} Normal editing has been paused to prevent accidental data loss. ${esc(copyStatus)}</div><p class="muted">Download the raw data for safekeeping, or import a previously exported valid BF2 backup. Starting fresh permanently replaces the existing saved data.</p><div class="card stack"><button id="rawRecoveryExport">Download unreadable saved data</button>${unsavedDataCandidate?'<button id="rejectedRecoveryExport" class="secondary">Download rejected change (not saved)</button>':''}<label>Restore a compatible BF2 backup<input id="recoveryImport" type="file" accept="application/json,.json"></label><button id="startFreshRecovery" class="danger">Discard unreadable data and start fresh</button></div></div>`;
 document.querySelector('#rawRecoveryExport').onclick=()=>{
  if(storageRecovery.raw==null){alert('The browser did not allow access to the raw stored data. Nothing can be downloaded from this session.');return}
  downloadTextFile(`babyflow2-unreadable-recovery-${isoDay()}.txt`,storageRecovery.raw);
 };
 document.querySelector('#rejectedRecoveryExport')?.addEventListener('click',()=>downloadTextFile(`babyflow2-rejected-change-${isoDay()}.json`,unsavedDataCandidate));
 document.querySelector('#recoveryImport').onchange=e=>selectBackupFile(e.target);
 document.querySelector('#startFreshRecovery').onclick=()=>{
  if(!confirm('The saved BF2 data cannot be read. Have you downloaded a copy or accepted that it may be unrecoverable?'))return;
  if(!confirm('FINAL WARNING: Replace the unreadable BF2 data and start from an empty BabyFlow 2? This cannot be undone without a backup.'))return;
  const clean=defaults(),raw=JSON.stringify(clean);
  try{localStorage.setItem(KEY,raw);if(localStorage.getItem(KEY)!==raw)throw new Error('Storage write failed')}
  catch{alert('Could not safely start fresh because browser storage is unavailable or full. Original BF2 data was not intentionally replaced.');return}
  db=clean;storageRecovery=null;storageWriteWarning='';unsavedDataCandidate=null;view='today';render();
 };
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mins(t){if(!t)return null;let [h,m]=t.split(':').map(Number);return h*60+m} function time(m){m=(m+1440)%1440;let h=Math.floor(m/60),mm=m%60,ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`}
function parseClockOne(v){let a=String(v??'').trim();if(!a)return null;let m=a.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);if(!m)return null;let h=+m[1],mi=+m[2],ap=(m[3]||'').toUpperCase();if(mi>59)return null;if(ap){if(h<1||h>12)return null;h=h%12+(ap==='PM'?12:0)}else if(h>23)return null;return h*60+mi}

}

function firstFeedOffsetAfterDream(gm,previousDay){
 // The previous BF Day may contain an overnight Dream Feed before this morning.
 // Bridge only across distinct calendar days; this avoids fabricating dates when
 // someone is manually testing Start New Day more than once on the same date.
 const noBridge={offset:0,resetAnchor:null};
 if(!previousDay?.events)return noBridge;
 const previousStart=new Date(previousDay.startedAt),today=new Date();
 if(!Number.isFinite(previousStart.getTime())||
    today.toDateString()===previousStart.toDateString())return noBridge;
 const priorMidnight=new Date(previousStart.getFullYear(),previousStart.getMonth(),previousStart.getDate()).getTime();
 const thisMidnight=new Date(today.getFullYear(),today.getMonth(),today.getDate()).getTime();
 const gmAbs=thisMidnight+mins(gm)*60000;
 const nightGoodnight=previousDay.events.find(e=>e.type==='goodnight');
 const bedAbs=nightGoodnight?priorMidnight+(nightGoodnight.actualStart??nightGoodnight.start)*60000:priorMidnight;
 const dream=previousDay.events.filter(e=>e.type==='dreamFeed')
  .filter(e=>priorMidnight+(e.actualStart??e.start)*60000>bedAbs&&priorMidnight+(e.actualStart??e.start)*60000<gmAbs)
  .sort((a,b)=>(b.actualStart??b.start)-(a.actualStart??a.start))[0];
 if(!dream)return noBridge;
 const interval=spec('feedInterval')?.preferred;
 if(!interval||interval<1)return noBridge;
 const actualDreamAbs=priorMidnight+(dream.actualStart??dream.start)*60000;
 // Never bridge from a stale Dream Feed after an unusually long gap between days.
 if(gmAbs-actualDreamAbs>1440*60000)return noBridge;
 const intervals=Math.max(1,Math.ceil((gmAbs-actualDreamAbs)/60000/interval));
 const firstAbs=actualDreamAbs+intervals*interval*60000;
 return {offset:Math.max(0,Math.round((firstAbs-gmAbs)/60000)),
  resetAnchor:Math.round((actualDreamAbs-thisMidnight)/60000)};
}
function generateDay(gm,previousDay=null){

  if(first){
   first.previousDreamResetAnchor=bridge.resetAnchor;
   // Determine the preferred first-Feed offset *before* building the complete
   // day. Otherwise a contextual exception that moves Feed 1 earlier might
   // leave the last numbered Feed missing from the initial projection.
   const draft={events:ev,conflicts:[],overrides:[]};
   const r=eventRule(draft,first,'feedInterval',1);
   if(r){
    const gmStart=mins(gm),cycles=Math.max(1,Math.ceil((gmStart-bridge.resetAnchor)/Math.max(1,r.preferred)));
    const contextualOffset=Math.max(0,bridge.resetAnchor+cycles*r.preferred-gmStart);
    if(contextualOffset!==bridge.offset){
     const rebuilt=buildProjection(gm,contextualOffset);
     if(rebuilt){ev=rebuilt;first=ev.find(e=>e.type==='feed');if(first)first.previousDreamResetAnchor=bridge.resetAnchor}
    }
   }
  }

}

function resolveConflict(choice){
 const d=db.currentDay;if(!d||!['skip','shorten','push'].includes(choice))return;
 const c=d.conflicts.find(x=>typeof x!=='string'&&x.code==='bedtime-fit');
 if(!c)return;
 const naps=d.events.filter(e=>e.type==='nap').sort((a,b)=>(a.actualStart??a.start)-(b.actualStart??b.start));
 const last=naps.at(-1),gn=d.events.find(e=>e.type==='goodnight'),ww=effective('wakeWindow');
 if(!last||!gn)return;
 if(choice==='skip'&&(last.state==='actual'||last.actualStart!=null||last.locked||last.locks?.start||last.locks?.duration||last.locks?.end)){
  alert('Skipping would remove a completed or locked nap. Choose another bedtime option.');return;
 }
 if(choice==='shorten'&&(last.actualStart!=null||!movable(last,'duration')||hasProtectedEnd(last))){
  alert('Shortening would change a completed nap or its protected duration or end time. Choose another bedtime option.');return;
 }
 if(choice==='push'&&(gn.actualStart!=null||!movable(gn,'start')||hasProtectedEnd(gn))){
  alert('Goodnight is Actual or locked. BabyFlow cannot push it automatically. No changes were made.');return;
 }
 const snapshot=structuredClone(last),goodnightStart=gn.start;
 if(choice==='skip')d.events=d.events.filter(e=>e.id!==last.id);
 if(choice==='shorten'){
  last.duration=Math.max(1,(gn.actualStart??gn.start)-ww-(last.actualStart??last.start));
  d.overrides.push({type:'napBelowMinimum',eventId:last.id});
 }
 if(choice==='push'){
  const newBed=effectiveEnd(last)+ww;
  if(newBed<=(gn.actualStart??gn.start))return;
  gn.start=newBed;
  d.overrides.push({type:'bedtimeLater',minutes:gn.start-clockValue('bedtime')});
 }

if(view==='settings'){document.querySelector('#saveSettings').onclick=()=>{let vals={};document.querySelectorAll('[data-set]').forEach(i=>vals[i.dataset.set]=i.type==='number'?+i.value:i.value.trim());if(!clockSpec(vals.bedtime,db.advanced.bedtimeRangePoint)){alert('Enter Bedtime as a time or time range, for example 9:30 PM or 9:00-9:30 PM.');return}if(vals.goodMorning&&!clockSpec(vals.goodMorning,db.advanced.goodMorningRangePoint)){alert('Enter Good Morning as a time or time range, for example 8:00 AM or 8:00-9:00 AM.');return}for(let k of ['feedInterval','feedDuration','wakeWindow','napDuration','extraFeedDuration']){let r=rangeSpec(vals[k]);if(!r||r.min<=0){alert('Enter '+k+' as positive whole minutes or a range, for example 60 or 55-65.');return}}if(!Number.isInteger(+vals.minCatNap)||+vals.minCatNap<1||+vals.minCatNap>1440){alert('Enter a valid minimum cat nap in whole minutes.');return}Object.assign(db.settings,vals);db.profile.babyName=document.querySelector('[data-profile="babyName"]').value.trim();if(db.currentDay){syncProjectedBedtime(db.currentDay);reconcileDay(db.currentDay)}const saved=save();render();if(saved)alert('Settings saved. Existing Actuals and Locks were preserved.')};document.querySelector('#advanced').onclick=advanced;document.querySelector('#dreamFeeds').onclick=manageDreamFeeds;document.querySelector('#exceptions').onclick=exceptions;document.querySelector('#export').onclick=exportBackup;document.querySelector('#import').onchange=e=>selectBackupFile(e.target)}}

function updateActivityCompletion(d){
 if(!d||!db.advanced.activityAutoComplete)return false;
 const startDate=new Date(d.startedAt);if(!Number.isFinite(startDate.getTime()))return false;
 const base=new Date(startDate.getFullYear(),startDate.getMonth(),startDate.getDate()).getTime();
 const nowMinutes=(Date.now()-base)/60000;
 const ordered=d.events.slice().sort((a,b)=>(a.actualStart??a.start)-(b.actualStart??b.start));
 let changed=false;
 for(let i=0;i<ordered.length;i++){
  let e=ordered[i];if(e.type!=='activity'||e.state!=='projected')continue;
  const st=e.actualStart??e.start;
  const explicitEnd=e.duration!=null?st+e.duration:null;
  let next=ordered.find((o,j)=>j>i&&(o.actualStart??o.start)>st);
  const deadline=explicitEnd??(next?(next.actualStart??next.start):null);
  if(deadline!=null&&nowMinutes>=deadline){e.state='autoCompleted';changed=true}
 }
 return changed;
}

function render(){if(storageRecovery){recoveryScreen();return}if(!db.setupComplete){setup();return}if(db.currentDay&&updateActivityCompletion(db.currentDay))save();navBar();app.innerHTML=view==='today'?today():view==='history'?history():settings();if(storageWriteWarning)app.insertAdjacentHTML('afterbegin',`<div class="notice" role="alert">${esc(storageWriteWarning)} ${unsavedDataCandidate?'<button class="secondary" id="failedSaveExport">Download rejected change</button>':''}</div>`);bind();if(storageWriteWarning&&unsavedDataCandidate)document.querySelector('#failedSaveExport').onclick=()=>downloadTextFile(`babyflow2-rejected-change-${isoDay()}.json`,unsavedDataCandidate);updateWakeWindowTimers()}
render();
// Re-evaluate Auto-Complete when the app becomes visible or while it remains open.
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db.currentDay){if(updateActivityCompletion(db.currentDay)){save();render()}}});
setInterval(()=>{if(!document.hidden&&db.currentDay&&updateActivityCompletion(db.currentDay)){save();render()}},60000);
setInterval(()=>{if(!document.hidden)updateWakeWindowTimers()},15000);
})();
</script></body></html>
